# Builds the referee and the example bots, plays a round-robin, verifies every game from its
# record, and keeps the records and standings as an artifact. On every change to a bot, the
# referee or a map (the quick feedback open bots get), weekly, and by hand.
name: round-robin
on:
  push:
    branches: [main]
    paths: ["bots.json", "bots/**", "crates/**", "maps/**", "Cargo.lock", ".github/workflows/round-robin.yml"]
  workflow_dispatch:
    inputs:
      seed:
        description: "First game's seed, to re-run a past event (empty: draw a drand round)"
        default: ""
  schedule:
    - cron: "0 12 * * 1"
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the referee and the bots
        run: |
          cargo build --release --locked
          scripts/build_registry.py
      - name: Tests
        run: cargo test --release --locked
      # The dice come from a drand round that comes out after the bots are built and pinned, so
      # nobody (us included) knows the luck before the games: the next quicknet round, fetched
      # once it exists. A seed input overrides it for re-running a past event.
      - name: Draw the beacon
        id: beacon
        if: ${{ !github.event.inputs.seed }}
        run: |
          CHAIN=52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971
          NEXT=$(( $(curl -fsS "https://api.drand.sh/$CHAIN/public/latest" | jq .round) + 1 ))
          for i in $(seq 20); do
            R=$(curl -fsS "https://api.drand.sh/$CHAIN/public/$NEXT" | jq -r .randomness) && break
            sleep 1
          done
          echo "drand quicknet round $NEXT: $R"
          echo "arg=--beacon $NEXT:$R" >> "$GITHUB_OUTPUT"
      - name: Round-robin
        run: |
          ARG="${{ steps.beacon.outputs.arg || format('--seed {0}', github.event.inputs.seed) }}"
          ./target/release/arena round-robin --map maps/skirmish.json $ARG --out out/rr --manifest bots/out/manifest.json
      - name: Verify every game from its record
        run: ./target/release/arena verify out/rr/game-*.json
      - uses: actions/checkout@v4
        with:
          repository: collinjackson/libaw
          path: libaw-src
          sparse-checkout: |
            web
            data
      - name: The standings page, with every turn in libaw's replay viewer
        run: |
          ./target/release/arena page out/rr --out out/site
          mkdir -p out/site/libaw && cp -r libaw-src/web libaw-src/data out/site/libaw/
      - uses: actions/upload-artifact@v4
        with:
          name: round-robin-${{ github.run_number }}
          path: |
            out/rr/
            out/site/
            bots/out/
