# Merges a pull request to bots.json on its own when check-bots passed and the change is the
# kind a maintainer would wave through: only bots.json changed, the author owns the repo of every
# bot they add, update or remove, and the check's games were clean for exactly those bots
# (scripts/automerge.py). Then it starts the round-robin, so the new version plays at once.
# Anything else waits for a maintainer, with the reasons in a comment.
#
# Runs from the default branch's own copy of this file and scripts (workflow_run), never the
# pull request's code; it reads the check's verdict and the PR's metadata only.
name: auto-merge
on:
  workflow_run:
    workflows: [check-bots]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  merge:
    # Only a fully successful check: if the bot's build job had uploaded a "verdict" of its own,
    # the play job's upload would fail and so would the check.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: The pull request this check ran on (still at the same commit)
        id: pr
        run: |
          PR=$(gh pr list --state open --json number,headRefOid -q ".[] | select(.headRefOid == \"$SHA\") | .number" | head -1)
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          [ -n "$PR" ] || echo "No open pull request at $SHA (closed, or new commits since the check)."
      - uses: actions/download-artifact@v4
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        with:
          name: verdict
          path: verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Decide
        if: steps.pr.outputs.number != ''
        id: decide
        run: |
          PR=${{ steps.pr.outputs.number }}
          [ -f verdict/verdict.json ] || echo '{"ok": false, "reasons": ["the check didn't finish"]}' > verdict/verdict.json
          gh pr view "$PR" --json author,baseRefOid -q '.author.login + " " + .baseRefOid' > meta.txt
          read -r AUTHOR BASE < meta.txt
          gh pr view "$PR" --json files -q '.files[].path' > files.txt
          gh api "repos/${{ github.repository }}/contents/bots.json?ref=$BASE" -q .content | base64 -d > base.json
          gh api "repos/${{ github.repository }}/contents/bots.json?ref=$SHA" -q .content | base64 -d > head.json
          if python3 scripts/automerge.py eligible base.json head.json "$AUTHOR" files.txt verdict/verdict.json > why.txt; then
            echo "merge=yes" >> "$GITHUB_OUTPUT"
          else
            echo "merge=no" >> "$GITHUB_OUTPUT"
          fi
          cat why.txt
      - name: Merge, then play the new version
        if: steps.decide.outputs.merge == 'yes'
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --squash --match-head-commit "$SHA"
          gh workflow run round-robin.yml
      - name: Say why it waits
        if: steps.decide.outputs.merge == 'no'
        run: |
          { echo "This one waits for a maintainer (auto-merge takes only clean updates by a bot's owner):"; echo; sed 's/^/    /' why.txt; } > body.txt
          gh pr comment ${{ steps.pr.outputs.number }} --body-file body.txt
