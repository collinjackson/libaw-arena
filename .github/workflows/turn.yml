# One turn of an asynchronous game, played by the bot's owner in their own repo. A first test of
# the loop that private bots will use (docs/proofs.md): the arena publishes the state, asks the
# owner's repo to play the turn through the libaw-arena GitHub App, waits for that run, and
# checks the turn record it gets back. There is no proof yet; the owner's run plays the turn with
# `arena turn`, which the turn prover will replace.
#
# The owner's repo needs the app installed and .github/workflows/prove-turn.yml (from
# templates/bot). The app can start and read that repo's workflow runs, nothing more.
name: turn
on:
  workflow_dispatch:
    inputs:
      bot_repo:
        description: "OWNER/REPO of the bot to move"
        required: true
permissions:
  contents: write   # the turns branch, where each state is published
concurrency:
  group: turns
  cancel-in-progress: false
jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOT_REPO: ${{ inputs.bot_repo }}
    steps:
      - name: Check the input
        id: bot
        run: |
          [[ "$BOT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "bot_repo must be OWNER/REPO"; exit 1; }
          echo "owner=${BOT_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${BOT_REPO##*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: referee-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - name: Publish the state to move from
        id: state
        run: |
          REQ="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ./target/release/arena start --map maps/skirmish.json --mode standard --out state.json
          git config user.name "libaw-arena"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin turns; then
            git checkout -q -B turns origin/turns
          else
            git checkout -q --orphan turns && git rm -rq --cached .
          fi
          mkdir -p "turns/$REQ" && cp state.json "turns/$REQ/state.json"
          git add "turns/$REQ/state.json" && git commit -qm "State for turn $REQ" && git push -q origin turns
          echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$(git rev-parse HEAD)/turns/$REQ/state.json" >> "$GITHUB_OUTPUT"
          echo "req=$REQ" >> "$GITHUB_OUTPUT"
          echo "seed=$(( GITHUB_RUN_ID % 1000000007 ))" >> "$GITHUB_OUTPUT"
      - name: A token for the bot's repo, from the app
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ARENA_APP_ID }}
          private-key: ${{ secrets.ARENA_APP_KEY }}
          owner: ${{ steps.bot.outputs.owner }}
          repositories: ${{ steps.bot.outputs.name }}
      - name: Ask the bot's repo to play the turn, and wait for it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REQ: ${{ steps.state.outputs.req }}
          URL: ${{ steps.state.outputs.url }}
          SEED: ${{ steps.state.outputs.seed }}
        run: |
          gh workflow run prove-turn.yml -R "$BOT_REPO" -f request="$REQ" -f state="$URL" -f seed="$SEED" -f arena="$GITHUB_SHA"
          for i in $(seq 30); do
            ID=$(gh run list -R "$BOT_REPO" -w prove-turn.yml --json databaseId,displayTitle -q ".[] | select(.displayTitle == \"turn $REQ\") | .databaseId" | head -1)
            [ -n "$ID" ] && break
            sleep 10
          done
          [ -n "$ID" ] || { echo "the bot's repo didn't start a run"; exit 1; }
          echo "run: https://github.com/$BOT_REPO/actions/runs/$ID"
          gh run watch "$ID" -R "$BOT_REPO" --exit-status --interval 30 > /dev/null
          gh run download "$ID" -R "$BOT_REPO" -n turn -D got
      - name: Check the turn
        run: ./target/release/arena check-turn --state state.json got/turn.json --out after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turn-${{ steps.state.outputs.req }}
          path: |
            state.json
            got/
            after.json
