# A pull request that adds or updates a bot in bots.json: checks the entry, builds the bot at its
# pinned commit, and plays it against the example bots (both seats, a fixed seed), so the
# submitter sees right away whether it loads, plays legal moves and stays within its fuel.
# Runs with a read-only token and no secrets: the bot's code is built and run, nothing else.
name: check-bots
on:
  pull_request:
    paths: ["bots.json"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check bots.json
        run: scripts/build_registry.py --check
      - name: Rust (the pinned toolchain in rust-toolchain.toml, with the wasm target)
        run: rustup toolchain install
      # Bots compile once per (repo, commit, path, toolchain); runs after that reuse the module.
      - uses: actions/cache@v4
        with:
          path: bots/cache
          key: bots-${{ github.run_id }}
          restore-keys: bots-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: referee-${{ hashFiles('Cargo.lock') }}
      - name: Build the referee and the changed bots at their commits
        run: |
          cargo build --release --locked
          scripts/build_registry.py --changed-since "origin/${{ github.base_ref }}"
      - name: Play them against the examples
        run: |
          for m in $(jq -r '.[].name' modes.json); do
            echo "== $m"
            ./target/release/arena round-robin --map maps/skirmish.json --mode "$m" --seed 1 --out "out/check/$m" --manifest bots/out/manifest.json
            echo "Strikes (illegal actions, faults, fuel) per game:"
            jq -r '.games[] | .file' "out/check/$m/standings.json" | while read -r f; do
              echo "  $f: $(jq -c .strikes "out/check/$m/$f")"
            done
          done
          ./target/release/arena verify out/check/*/game-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: check-${{ github.event.pull_request.number }}
          path: out/check/
