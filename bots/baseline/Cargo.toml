[package]
name = "bot-baseline"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arena-bot = { path = "../sdk" }
libaw = { git = "https://github.com/collinjackson/libaw" }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
