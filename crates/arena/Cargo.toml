[package]
name = "libaw-arena"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Referee for sandboxed bot-vs-bot games on libaw's engine."

[lib]
name = "arena"

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
libaw = { git = "https://github.com/collinjackson/libaw" }
serde_json = "1"
rand_chacha = "0.9"
rand_core = "0.9"
sha2 = "0.10"
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "wat"] }
