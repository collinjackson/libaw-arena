[package]
name = "arena-abi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The host side of the arena's bot interface (docs/bot-abi.md): the binary answers to a bot's questions, shared by the referee and the turn prover."

[features]
default = ["std"]
std = ["libaw/std"]

[dependencies]
libaw = { git = "https://github.com/collinjackson/libaw", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
